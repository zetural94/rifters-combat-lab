<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Rifters Combat Lab</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 440px; margin: 4rem auto; padding: 0 1rem; color: #1a1a1a; }
    input, button { font: inherit; padding: .5rem .7rem; width: 100%; box-sizing: border-box; margin: .35rem 0; }
    button { cursor: pointer; background: #1a1a1a; color: #fff; border: 0; }
    button:disabled { opacity: .6; cursor: wait; }
    .err { color: #a30; min-height: 1.2em; }
    .hint { color: #666; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Rifters Combat Lab</h1>
  <p class="hint">Hasło odszyfrowuje sandbox, silnik i karty. Dostaniesz je od Adriana.</p>
  <form id="f">
    <label for="pw">Hasło</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required />
    <button id="go" type="submit">Wejdź do sandboxa</button>
  </form>
  <p class="err" id="err"></p>
  <script>
    const AUTH = "riftersLabAuth";
    const AUTH_OK = "open";
    const STAMP = "20260924remed";

    function decodePack(plain) {
      const view = new DataView(plain);
      if (plain.byteLength < 4) throw new Error("pack");
      const count = view.getUint32(0);
      if (count > 2000) throw new Error("pack");
      const files = [];
      let o = 4;
      const dec = new TextDecoder();
      for (let i = 0; i < count; i++) {
        const pathLen = view.getUint16(o);
        o += 2;
        const rel = dec.decode(new Uint8Array(plain, o, pathLen));
        o += pathLen;
        const bodyLen = view.getUint32(o);
        o += 4;
        const copy = plain.slice(o, o + bodyLen);
        o += bodyLen;
        files.push([rel, copy]);
      }
      return files;
    }

    async function decryptSeal(blob, password) {
      const u8 = new Uint8Array(blob);
      if (u8.length < 53) throw new Error("seal");
      const magic = String.fromCharCode(u8[0], u8[1], u8[2], u8[3]);
      if (magic !== "RFLB" || u8[4] !== 1) throw new Error("seal");
      const view = new DataView(blob);
      const iterations = view.getUint32(5);
      const salt = u8.slice(9, 25);
      const iv = u8.slice(25, 37);
      const cipherBytes = u8.slice(37);
      const keyMat = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
        keyMat,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipherBytes);
      return decodePack(plain);
    }

    async function controlWorker() {
      if (!("serviceWorker" in navigator)) throw new Error("Ta przeglądarka nie obsługuje service workera.");
      const reg = await navigator.serviceWorker.register("sw.js");
      await navigator.serviceWorker.ready;
      if (navigator.serviceWorker.controller) return navigator.serviceWorker.controller;
      await new Promise((resolve) => {
        navigator.serviceWorker.addEventListener("controllerchange", () => resolve(), { once: true });
      });
      if (!navigator.serviceWorker.controller) throw new Error("Service worker nie przejął strony.");
      return navigator.serviceWorker.controller;
    }

    function deliver(sw, files) {
      return new Promise((resolve, reject) => {
        const channel = new MessageChannel();
        const timer = setTimeout(() => reject(new Error("Service worker nie potwierdził paczki.")), 8000);
        channel.port1.onmessage = (event) => {
          clearTimeout(timer);
          if (event.data && event.data.ok) resolve(event.data);
          else reject(new Error("Service worker odrzucił paczkę."));
        };
        const transfers = [channel.port2];
        const payload = [];
        for (const pair of files) {
          transfers.push(pair[1]);
          payload.push(pair);
        }
        sw.postMessage({ type: "seal", files: payload }, transfers);
      });
    }

    document.getElementById("f").addEventListener("submit", async (event) => {
      event.preventDefault();
      const err = document.getElementById("err");
      const btn = document.getElementById("go");
      err.textContent = "";
      btn.disabled = true;
      try {
        const password = document.getElementById("pw").value;
        const res = await fetch("lab.enc?v=" + STAMP, { cache: "no-store" });
        if (!res.ok) throw new Error("Brak lab.enc (" + res.status + ").");
        const files = await decryptSeal(await res.arrayBuffer(), password);
        const sw = await controlWorker();
        await deliver(sw, files);
        sessionStorage.setItem(AUTH, AUTH_OK);
        location.href = "sandbox.html";
      } catch (ex) {
        const name = ex && ex.name;
        err.textContent = name === "OperationError" ? "Złe hasło." : (ex && ex.message) || "Nie udało się odszyfrować.";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
